<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panha Creative Developer</title>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
      rel="preload"
      as="style"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <link
      rel="preload"
      as="style"
      href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
        rel="stylesheet"
      />
      <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css"
      />
    </noscript>
  </head>
  <body class="antialiased selection:bg-pink-500 selection:text-white">
    <div id="app">
      <div
        style="
          min-height: 100vh;
          display: grid;
          place-items: center;
          padding: 24px;
          background: #020617;
          color: #f8fafc;
          font-family: Arial, sans-serif;
          text-align: center;
        "
      >
        <div>
          <h1 style="font-size: 28px; margin-bottom: 12px">Loading Vue app...</h1>
          <p style="color: #94a3b8; line-height: 1.6">
            If this stays here, run <strong>npm.cmd run dev</strong> and open
            <strong>http://127.0.0.1:5173/</strong>.
          </p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
